# 一键部署：MySQL + Redis + RabbitMQ + 后端 + Nginx
#
# 使用：
#   cp .env.docker.example .env      # 按需改密码
#   docker compose up -d --build
#   浏览器访问 http://localhost:8080
#
# 说明：
#   - 后端不直接暴露公网（只在 compose 网络内被 nginx 访问），调试时才映射 8082
#   - db/db.sql 只在 MySQL 数据卷为空时执行一次（初始化）
#   - 修改代码后重新执行 docker compose up -d --build 即可

name: hmdp

services:
  mysql:
    image: mysql:8.0
    container_name: hmdp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: hmdp
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - ./db/db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hmdp-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-1234}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-1234}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hmdp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-hmdp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-1234}
      TZ: Asia/Shanghai
    ports:
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./AI-dianping-backend
    container_name: hmdp-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-1234}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-hmdp}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-1234}
      RABBITMQ_ENABLED: "true"
      ORDER_TIMEOUT_MS: ${ORDER_TIMEOUT_MS:-900000}
      MCP_API_KEY: ${MCP_API_KEY:-}
      API_KEY: ${API_KEY:-}
      IMAGE_UPLOAD_DIR: /imgs/
      LOG_PATH: /logs/backend
    volumes:
      - ./AI-dianping-frontend/html/hmdp/imgs:/imgs
      - backend-logs:/logs
    ports:
      - "8082:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: hmdp-nginx
    volumes:
      - ./AI-dianping-frontend/html/hmdp:/usr/share/nginx/html:ro
      - ./AI-dianping-frontend/html/hmdp/imgs:/usr/share/nginx/html/imgs
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  backend-logs:
